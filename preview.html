<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MSMRA Membership Payment</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .payment-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 20px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #0d6efd;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            color: #0d47a1;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .amount {
            font-size: 42px;
            font-weight: bold;
            color: #0d6efd;
            margin: 15px 0;
        }

        .membership {
            background: #f1f8ff;
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            color: #333;
            font-size: 16px;
        }

        .pay-button {
            display: block;
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 12px;
            background: #0d6efd;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(13,110,253,0.35);
            transition: 0.2s;
        }

        .pay-button:hover {
            background: #0b5ed7;
            transform: translateY(-2px);
        }

        .upi {
            margin-top: 18px;
            font-size: 14px;
            color: #666;
            word-break: break-all;
        }

        .note {
            margin-top: 20px;
            font-size: 13px;
            color: #777;
            line-height: 1.5;
        }

        .success {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="payment-card">

    <div class="logo">
        MSMRA
    </div>

    <h1>MSMRA Membership</h1>

    <div class="subtitle">
        Membership Subscription Payment
    </div>

    <div class="membership">
        <strong>Membership Fee</strong>
        <div class="amount">₹700</div>
    </div>

    <!-- PAYMENT BUTTON -->
    <a
        href="upi://pay?pa=9561922398@ybl&pn=Payment&am=700&cu=INR"
        class="pay-button"
        onclick="paymentClicked()">
        💳 PAY ₹700 NOW
    </a>

    <div class="upi">
        UPI ID:<br>
        <strong>9561922398@ybl</strong>
    </div>

    <div id="successMessage" class="success">
        Payment option opened. Please complete the payment in your UPI app.
    </div>

    <div class="note">
        Click the button above to pay ₹700 using a supported UPI app
        such as Google Pay, PhonePe, Paytm or BHIM.
    </div>

</div>

<script>
function paymentClicked() {
    document.getElementById("successMessage").style.display = "block";
}
</script>

</body>
</html>
